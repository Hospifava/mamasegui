# Publica CardioSegui en GitHub Pages.
# Se ejecuta solo cada vez que subís cambios a la rama "main".
# Publica ÚNICAMENTE la carpeta "public" (el resto del repositorio no queda en el sitio).

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben cambios seguidos, se publica solo el último
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta public
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
